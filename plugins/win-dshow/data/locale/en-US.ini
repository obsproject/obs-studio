Buffering="Buffering"
Buffering.ToolTip="When enabled, buffers video/audio data to ensure the smoothest and most\naccurate playback possible, but at the cost of increased latency. When using\nbuffering with a video capture card, it's recommended to set the card and the\nprogram to the same framerate for best results.\n\nWhen disabled, ensures lowest latency playback, but at the cost of frame\nplayback accuracy. This is ideal for face cameras, or when you want to use the\nprogram's preview window to play a console.\n\nAuto-detect (default) sets it to enabled if the device has delay, and disabled\nif it has no delay."
Buffering.AutoDetect="Auto-Detect"
Buffering.Enable="Enable"
Buffering.Disable="Disable"
Buffering.FrameCount="Frame-count buffering"
Buffering.TargetFrames="Target buffered frames"
Buffering.TargetFrames.ToolTip="Wait for this many queued video frames before starting or restarting playback. The oldest retained frame is aligned to the current OBS output timestamp. Select the oldest queued frame whose scheduling timestamp is within ±0.6 OBS output frame intervals. Discard older frames; wait for frames more than 0.6 intervals ahead."
Buffering.MaxFrames="Maximum buffered frames"
Buffering.MaxFrames.ToolTip="If the queue exceeds this count, discard the oldest frames until only the target count remains, then restart the scheduling clock. The maximum cannot be lower than the target."
Buffering.RebuildTimestamps="Rebuild video scheduling timestamps"
Buffering.RebuildTimestamps.ToolTip="Generate video scheduling timestamps from the manually entered capture framerate instead of the device timestamps. Re-anchor to the OBS output timestamp after prefill, an empty queue, or overflow. Original timestamps are retained for existing audio synchronization; this does not reclock audio."
Buffering.FPSNumerator="Actual capture FPS numerator"
Buffering.FPSDenominator="Actual capture FPS denominator"
Buffering.FPS.ToolTip="Enter the actual capture rate as a fraction, for example 60/1 or 60000/1001. This controls video scheduling only; it does not change the capture device mode. An incorrect rate can cause repeated underruns or overflows."
