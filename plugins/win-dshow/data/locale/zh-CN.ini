Buffering="缓冲"
Buffering.ToolTip="当启用时，视频/音频数据被缓冲以确保最流畅和最准确的播放，但代价是增加了延迟。\n在使用视频采集卡进行缓冲时，建议将采集卡和程序设置为相同的帧率以获得最佳效果。\n\n当禁用时，确保最低延迟的播放，但以牺牲帧播放准确性为代价。\n这对于人脸摄像头或者当你想要使用程序的预览窗口播放游戏机时是理想的选择。\n\n自动检测（默认）会根据设备是否具有延迟来设置是否启用缓冲。\n如果设备有延迟，则启用缓冲；如果设备没有延迟，则禁用缓冲。"
Buffering.AutoDetect="自动检测"
Buffering.Enable="启用"
Buffering.Disable="禁用"
Buffering.FrameCount="按帧数缓冲"
Buffering.TargetFrames="目标缓冲帧数"
Buffering.TargetFrames.ToolTip="攒够此数量的视频帧后才开始或重新开始输出，将保留的最老一帧对齐到当前 OBS 输出时间戳。在调度时间戳与 OBS 输出时间戳相差 ±0.6 个输出间隔的已缓存帧中选择最老一帧；更老的帧丢弃，超前超过 0.6 个间隔的帧等待。"
Buffering.MaxFrames="最大缓冲帧数"
Buffering.MaxFrames.ToolTip="队列超过此数量时，丢弃旧帧直到只剩目标帧数，再重新开始计时。最大帧数不能小于目标帧数。"
Buffering.RebuildTimestamps="重建视频调度时间戳"
Buffering.RebuildTimestamps.ToolTip="按手动填写的实际采集帧率生成视频调度时间戳，不使用设备时间戳的间隔。攒够目标帧数、缓冲耗尽或溢出后，重新对齐 OBS 输出时间戳。原始时间戳保留用于现有音画同步，不重新计时音频。"
Buffering.FPSNumerator="实际采集帧率分子"
Buffering.FPSDenominator="实际采集帧率分母"
Buffering.FPS.ToolTip="用分数填写真实采集帧率，例如 60/1 或 60000/1001。仅影响视频调度，不改变设备采集模式。填写不准确可能造成反复缓冲耗尽或溢出。"
