QuickTransitions.DuplicateScene="Sahna nusxasini yaratish"
QuickTransitions.DuplicateSceneTT="Bir xil sahnani tahrirlashda dastur chiqishini o‘zgartirmasdan manbalarning joylashuvi, o‘lchami va ko‘rinishini tahrirlash imkonini beradi.\nManbalar xususiyatlarini dastur chiqishini o‘zgartirmasdan tahrirlash uchun “Manbalarni nusxalash”ni yoqing.\nBu qiymatni o‘zgartirish joriy dastur sahnasini asl holatiga qaytaradi (agar u hali mavjud bo‘lsa)."
QuickTransitions.EditProperties="Manbalarni nusxalash"
QuickTransitions.EditPropertiesTT="Bir xil sahnani tahrirlashda dastur chiqishini o‘zgartirmasdan manbalar xususiyatlarini tahrirlash imkonini beradi.\nBundan faqat “Sahna nusxasini yaratish” yoqilgan bo‘lsa foydalanish mumkin.\nAyrim manbalar (masalan, signal olish yoki media manbalari) buni qo‘llab-quvvatlamaydi va ularni alohida tahrirlab bo‘lmaydi.\nBu qiymatni o‘zgartirish joriy dastur sahnasini asl holatiga qaytaradi (agar u hali mavjud bo‘lsa).\n\nOgohlantirish: Manbalar nusxalanishi sababli qo‘shimcha tizim yoki video resurslari talab qilinishi mumkin."
